name: routecharge_mobile
description: "RouteCharge Mobile Application - Electric Vehicle Charging Station Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Tipografi
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.8

  # State Management & Network
  provider: ^6.1.1
  http: ^1.2.0

  # Konum & Navigasyon
  geolocator: ^10.1.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true